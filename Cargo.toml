[package]
name = "gpufetch"
version = "0.1.0"
edition = "2021"
authors = ["NLP-Core-Team"]
description = "Simple yet fancy GPU architecture fetching tool"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
libc = "0.2"

[build-dependencies]
pkg-config = "0.3"
cc = "1.0"

[features]
default = ["intel", "amd"]
cuda = []
intel = []
amd = []

[[bin]]
name = "gpufetch"
path = "src/main.rs"
